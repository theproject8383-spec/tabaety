<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>طابعتي — اطبع من جوالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181B; --ink-2:#5E6A73; --line:#DCE2E5; --line-2:#EBEFF1; --ground:#F4F6F6; --card:#FFFFFF;
  --accent:#0A6B74; --accent-ink:#084F56; --accent-tint:#E1F0F1;
  --ok:#1D7F48; --ok-tint:#E3F3E9; --warn:#8A5A0B; --warn-tint:#FBF0DC; --bad:#B83A26; --bad-tint:#FBE7E3;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.ltr{direction:ltr;unicode-bidi:isolate}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center}
.brand b{font-size:17px;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--ink-2)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}

.kiosk{margin:14px 16px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:12px}
.kiosk .code{font:600 20px var(--mono);background:var(--accent-tint);color:var(--accent);border-radius:10px;padding:6px 10px;direction:ltr}
.kiosk .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kiosk .meta b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kiosk .meta span{font-size:12px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-tint)} .pill.warn{color:var(--warn);background:var(--warn-tint)} .pill.bad{color:var(--bad);background:var(--bad-tint)}

.steps{display:flex;gap:6px;padding:14px 16px 0}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}

main{flex:1;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:23px;line-height:1.35}
p.sub{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.notice.warn{background:var(--warn-tint);color:#6B4508} .notice.bad{background:var(--bad-tint);color:#7A2414} .notice.info{background:var(--accent-tint);color:var(--accent-ink)}

.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border:2px dashed #9FB4B8;border-radius:16px;background:var(--card);text-align:center;cursor:pointer;position:relative}
.drop.disabled{opacity:.5;pointer-events:none}
.drop .ic{width:54px;height:54px;border-radius:14px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center}
.drop b{font-size:16px} .drop span{font-size:12px;color:var(--ink-2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.trust b{color:var(--ink);font-size:12px}

.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress div{height:100%;background:var(--accent);border-radius:4px;width:0;transition:width .2s}
.progress.indet div{width:35%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(120%)}100%{transform:translateX(-300%)}}

.file{display:flex;align-items:center;gap:12px}
.file .thumb{width:44px;height:54px;border-radius:6px;background:var(--bad-tint);color:var(--bad);display:grid;place-items:center;font:600 11px var(--mono);flex:none}
.file .thumb.img{background:var(--accent-tint);color:var(--accent)}
.file b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-align:right;unicode-bidi:plaintext}
.file span{font-size:12px;color:var(--ink-2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--ground);border-radius:12px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:9px;border:0;background:var(--card);font-size:20px;color:var(--ink)}
.stepper button:disabled{opacity:.4}
.stepper output{min-width:34px;text-align:center;font:600 18px var(--mono)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{min-height:48px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px}
.seg button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-tint);color:var(--accent)}
.seg button:disabled{opacity:.45}
.sum{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sum .row span:first-child{color:var(--ink-2)}
.sum .total{border-top:1px solid var(--line-2);padding-top:10px}
.sum .total b:last-child{font:600 22px var(--mono)}
.methods{display:flex;flex-direction:column;gap:8px}
.method{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;min-height:60px;padding:10px 14px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.method[aria-checked="true"]{border:2px solid var(--accent)}
.method b{font-size:15px;display:block} .method small{font-size:12px;color:var(--ink-2)}
.method .dot{width:20px;height:20px;border-radius:50%;flex:none;border:2px solid #9FB4B8}
.method[aria-checked="true"] .dot{border:6px solid var(--accent)}

.center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0 2px}
.badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.badge.ok{background:var(--ok-tint);color:var(--ok)} .badge.done{background:var(--accent);color:#fff}
.badge.bad{background:var(--bad-tint);color:var(--bad)} .badge.warn{background:var(--warn-tint);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.facts span{font-size:12px;color:var(--ink-2);display:block} .facts b{font-family:var(--mono)}
.printer-anim{position:relative;width:150px;height:120px;margin:0 auto}
.printer-anim .body{position:absolute;inset:30px 0 0;background:var(--ink);border-radius:14px}
.printer-anim .slot{position:absolute;left:30px;right:30px;top:70px;height:70px;overflow:hidden}
.printer-anim .sheet{height:70px;background:#fff;border:1px solid var(--line);animation:feed 1.1s ease-in-out infinite}
.printer-anim .light{position:absolute;left:22px;right:22px;top:62px;height:6px;border-radius:3px;background:#3BB0BB;animation:pulse 1.1s infinite}
@keyframes feed{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.printer-anim .sheet,.printer-anim .light,.progress.indet div{animation:none}}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{width:44px;height:44px;border:0;background:transparent;font-size:26px;color:#C9D2D6}
.stars button.on{color:#E0A84A}

footer.cta{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{width:100%;min-height:54px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--accent)}
.btn:hover{background:var(--accent-ink)}
.btn.go{background:var(--ok)} .btn.go:hover{background:#166339}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;min-height:48px;font-size:14px}
.link-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.help{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.6}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,24,27,.5)}
dialog h2{margin:0 0 6px;font-size:19px}
dialog p{margin:0 0 16px;color:var(--ink-2);font-size:14px;line-height:1.6}
dialog .acts{display:flex;flex-direction:column;gap:8px}
.code-entry{display:flex;gap:8px}
.code-entry input{flex:1;min-height:52px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:600 20px var(--mono);text-align:center;direction:ltr}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/" aria-label="طابعتي — الصفحة الرئيسية">
      <span class="logo"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg></span>
      <span><b>طابعتي</b><small>اطبع من جوالك</small></span>
    </a>
    <button class="icon-btn" id="backBtn" hidden aria-label="رجوع"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
  </header>

  <div class="kiosk" id="kioskCard" hidden>
    <div class="code" id="kCode">—</div>
    <div class="meta"><b id="kLoc">…</b><span id="kSub">A4 · أبيض وأسود</span></div>
    <span class="pill" id="kPill"><i></i><span></span></span>
  </div>
  <div class="steps" id="steps" hidden aria-hidden="true"><div></div><div></div><div></div><div></div></div>

  <main id="main" aria-live="polite"></main>
  <footer class="cta" id="cta" hidden></footer>
</div>

<dialog id="confirmDlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="acts">
    <button class="btn go" id="dlgYes"></button>
    <button class="btn ghost" id="dlgNo">لا، بعدين</button>
  </div>
</dialog>

<script>
"use strict";
const API = "https://dloicztspjligjjowhps.supabase.co/functions/v1/public-api";
const MAX_BYTES = 20 * 1024 * 1024;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => Number(n || 0).toFixed(2);
const ICON = {
  up: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  check: '<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg>',
  alert: '<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8" fill="currentColor"/><path d="M10.3 3.9L2.5 17.5A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  clock: '<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  wa: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D7F48" stroke-width="2"><path d="M4 20l1.4-4A8 8 0 1 1 8 18.6z"/></svg>',
  lock: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6B74" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  pin: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6B74" stroke-width="2"><path d="M12 3v10"/><circle cx="12" cy="17" r="3"/></svg>',
  back: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6B74" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>',
};

const KIOSK_STATUS = {
  ok: ["ok", "متاحة"], paused: ["warn", "متوقفة مؤقتًا"], offline: ["bad", "غير متصلة"], printer_error: ["bad", "فيها عطل"],
  low_ink: ["warn", "الحبر منخفض"], no_paper: ["warn", "الورق خلص"], disabled: ["bad", "خارج الخدمة"],
};
const KIOSK_REASON = {
  paused: "الطابعة متوقفة مؤقتًا للصيانة. جرّب بعد شوي.",
  offline: "الطابعة مو متصلة الحين. جرّب بعد دقائق، أو تواصل معنا.",
  printer_error: "الطابعة فيها عطل (ورق منحشر أو باب مفتوح). بلّغنا وبنصلحها.",
  low_ink: "الحبر قارب يخلص، وما نبي نطبع لك أوراق باهتة. بنعبّيه قريب.",
  no_paper: "الورق خلص في هذي الطابعة. بنعبّيها قريب.",
  disabled: "هذي الطابعة خارج الخدمة حاليًا.",
};
const ERR = {
  unsupported_type: "نوع الملف غير مدعوم. نقبل PDF والصور (JPG وPNG). ملف Word؟ احفظه PDF من «مشاركة» أو «طباعة» ثم ارفعه.",
  encrypted: "الملف مقفول بكلمة مرور. افتح القفل واحفظه من جديد ثم ارفعه.",
  corrupt: "ما قدرنا نقرأ الملف، يمكن يكون تالف. جرّب تحفظه من جديد.",
  empty: "الملف فاضي.",
  too_large: "الملف أكبر من 20 ميجا. صغّر حجمه أو قسّمه.",
  too_many_pages: "الملف فيه صفحات أكثر من المسموح لهذي الطابعة",
  rate_limited: "طلبات كثيرة من نفس الجهاز. انتظر دقائق وجرّب.",
  kiosk_unavailable: "الطابعة غير متاحة الحين.",
  kiosk_not_found: "ما لقينا هذي الطابعة. تأكد من الكود المكتوب عليها.",
  supplies: "الورق أو الحبر ما يكفي لطلبك الحين. جرّب عدد نسخ أقل.",
  bad_copies: "عدد النسخ غير مسموح.",
  no_duplex: "هذي الطابعة ما تطبع على الوجهين.",
  mock_disabled: "الدفع غير متاح حاليًا.",
  bad_state: "صار تغيير على الطلب. حدّث الصفحة.",
  unauthorized: "رابط الطلب غير صالح.",
  server_error: "صار خطأ عندنا. جرّب مرة ثانية.",
  network: "ما فيه اتصال بالإنترنت. تأكد من النت وجرّب.",
};

const S = { kioskId: null, kiosk: null, settings: {}, order: null, token: null, view: null,
  screen: "boot", copies: 1, duplex: false, method: "apple", upload: null, busy: false, rating: 0, poll: null };

// ---------- الاتصال ----------
async function api(method, path, body, extra = {}) {
  const headers = { ...extra };
  if (S.token) headers["X-Order-Token"] = S.token;
  let payload;
  if (body instanceof Blob || body instanceof ArrayBuffer) payload = body;
  else if (body) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, { method, headers, body: payload }); }
  catch { throw Object.assign(new Error("network"), { code: "network" }); }
  let data = {};
  try { data = await res.json(); } catch { /* فاضي */ }
  if (!res.ok) throw Object.assign(new Error(data.error || "server_error"), { code: data.error || "server_error", data, status: res.status });
  return data;
}

function uploadFile(blob, name, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", `${API}/orders/${S.order}/file`);
    x.setRequestHeader("X-Order-Token", S.token);
    x.setRequestHeader("X-File-Name", encodeURIComponent(name));
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => {
      let d = {}; try { d = JSON.parse(x.responseText); } catch { /* */ }
      x.status === 200 ? resolve(d) : reject(Object.assign(new Error(d.error || "server_error"), { code: d.error || "server_error", data: d }));
    };
    x.onerror = () => reject(Object.assign(new Error("network"), { code: "network" }));
    x.send(blob);
  });
}

function errText(e) {
  const c = e?.code || "server_error";
  if (c === "too_many_pages" && e.data?.max) return `${ERR.too_many_pages} (${e.data.max} صفحة كحد أقصى).`;
  if (c === "kiosk_unavailable" && e.data?.status) return KIOSK_REASON[e.data.status] || ERR.kiosk_unavailable;
  if (c === "supplies" && e.data?.reason === "offline") return KIOSK_REASON.offline;
  return ERR[c] || ERR.server_error;
}

// ---------- حفظ الطلب في الجوال (يرجع له لو قفل الصفحة) ----------
const storeKey = () => `tabaety.order.${S.kioskId}`;
function saveOrder() {
  try { localStorage.setItem(storeKey(), JSON.stringify({ id: S.order, token: S.token, at: Date.now() })); } catch { /* وضع خاص */ }
  history.replaceState(null, "", `?k=${encodeURIComponent(S.kioskId)}#o=${S.order}.${S.token}`);
}
function clearOrder() {
  try { localStorage.removeItem(storeKey()); } catch { /* */ }
  S.order = null; S.token = null; S.view = null;
  history.replaceState(null, "", `?k=${encodeURIComponent(S.kioskId)}`);
}
function loadSavedOrder() {
  const m = location.hash.match(/#o=([0-9a-f-]{36})\.([A-Za-z0-9_-]{20,100})/);
  if (m) return { id: m[1], token: m[2] };
  try {
    const s = JSON.parse(localStorage.getItem(storeKey()) || "null");
    if (s && Date.now() - s.at < 3 * 3600 * 1000) return s;
  } catch { /* */ }
  return null;
}

// ---------- الصور ← JPEG نظيف (يحل HEIC من الآيفون ويصغّر الحجم) ----------
async function imageToJpeg(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    bmp = await new Promise((res, rej) => {
      const img = new Image(); const u = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(u); res(img); };
      img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); };
      img.src = u;
    });
  }
  const maxSide = 2480;
  const w0 = bmp.width, h0 = bmp.height;
  const sc = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function confirmDlg(title, text, yes) {
  return new Promise((resolve) => {
    const d = $("#confirmDlg");
    $("#dlgTitle").textContent = title; $("#dlgText").textContent = text; $("#dlgYes").textContent = yes;
    const done = (v) => { d.close(); resolve(v); };
    $("#dlgYes").onclick = () => done(true); $("#dlgNo").onclick = () => done(false);
    d.oncancel = () => resolve(false);
    d.showModal();
  });
}
function supportLink(extra = "") {
  const n = String(S.settings.support_whatsapp || "").replace(/\D/g, "");
  const t = `السلام عليكم، عندي استفسار بخصوص طابعة ${S.kioskId || ""}${extra}`;
  return n ? `https://wa.me/${n}?text=${encodeURIComponent(t)}` : "#";
}

}
function setSteps(n) {
  const el = $("#steps"); el.hidden = n == null;
  [...el.children].forEach((d, i) => d.classList.toggle("on", n != null && i <= n));
}
function setCta(html) {
  const f = $("#cta"); f.hidden = !html; f.innerHTML = html || "";
}
function setBack(fn) {
  const b = $("#backBtn"); b.hidden = !fn; b.onclick = fn || null;
}
function stopPoll() { if (S.poll) { clearTimeout(S.poll); S.poll = null; } }

  S.screen = screen; stopPoll(); setBack(null);
  const m = $("#main");
  const r = SCREENS[screen]; m.innerHTML = r.html(); r.after?.(); window.scrollTo(0, 0);
}

let countdownTimer = null;
function tickCountdown(sel, iso, onEnd) {
  clearInterval(countdownTimer);
  const end = Date.parse(iso || "");
  if (!end) return;
  const f = () => {
    const el = $(sel); if (!el) { clearInterval(countdownTimer); return; }
    const s = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (s <= 0) { clearInterval(countdownTimer); onEnd?.(); }
  };
  f(); countdownTimer = setInterval(f, 1000);
}

function routeByView() {
  const st = S.view.stage;
  if (S.view.kiosk) { S.kiosk = S.view.kiosk; renderKiosk(); }
  if (st === "new") return show("start");
  if (st === "uploaded" || st === "quoted") { S.copies = S.view.copies || 1; S.duplex = !!S.view.duplex; return show("options"); }
  if (st === "ready") return show("ready");
  if (st === "queued" || st === "printing") return show("printing");
  if (st === "done") return show("done");
  return show("problem");
}

// ---------- الأفعال ----------
async function refreshKioskOnStart() {
  try {
    const r = await api("GET", `/kiosks/${encodeURIComponent(S.kioskId)}`);
    S.kiosk = r.kiosk; S.settings = r.settings || {}; renderKiosk();
    if (!S.order) show("start");
  } catch (e) {
    if (e.code === "kiosk_not_found") { S.fatal = ERR.kiosk_not_found; show("fatal"); }
    else if (S.screen === "start") S.poll = setTimeout(refreshKioskOnStart, 15000);
  }
}

async function refreshOrder() {
  try {
    S.view = await api("GET", `/orders/${S.order}`);
    const before = S.screen; routeByView();
    if (before === S.screen && S.screen === "printing") { /* استمرار الاستطلاع داخل after */ }
  } catch (e) {
    if (e.code === "unauthorized" || e.status === 404) { clearOrder(); return refreshKioskOnStart(); }
    S.poll = setTimeout(refreshOrder, 4000);
  }
}

async function onFile(file) {
  if (!file || S.busy) return;
  const box = $("#upBox"), errBox = $("#upErr");
  errBox.hidden = true;
  const name = file.name || "ملف";
  const ext = name.split(".").pop().toLowerCase();
  const isPdf = file.type === "application/pdf" || ext === "pdf";
  const isImg = (file.type || "").startsWith("image/") || ["jpg", "jpeg", "png", "heic", "heif", "webp"].includes(ext);
  if (["doc", "docx", "ppt", "pptx", "xls", "xlsx", "txt", "pages", "key"].includes(ext)) {
    errBox.textContent = "ملفات Word وPowerPoint ما نقبلها مباشرة. افتح الملف ← «مشاركة» أو «طباعة» ← «حفظ PDF»، وبعدين ارفعه.";
    errBox.hidden = false; return;
  }
  if (!isPdf && !isImg) { errBox.textContent = ERR.unsupported_type; errBox.hidden = false; return; }

  S.busy = true; $("#drop").classList.add("disabled"); box.hidden = false;
  $("#upName").textContent = name; $("#upPct").textContent = ""; $("#upMsg").textContent = "نجهّز الملف…";
  const bar = $("#upBar"); bar.classList.add("indet");
  try {
    let blob = file, sendName = name;
    if (isImg) {
      blob = await imageToJpeg(file);
      if (!blob) throw Object.assign(new Error("corrupt"), { code: "corrupt" });
      sendName = name.replace(/\.[^.]+$/, "") + ".jpg";
    }
    if (blob.size > MAX_BYTES) throw Object.assign(new Error("too_large"), { code: "too_large" });
    if (!S.order) {
      const r = await api("POST", "/orders", { kiosk_id: S.kioskId });
      S.order = r.order_id; S.token = r.token; saveOrder();
    }
    bar.classList.remove("indet"); $("#upMsg").textContent = "نرفع الملف…";
    S.view = await uploadFile(blob, sendName, (p) => {
      bar.firstElementChild.style.width = Math.round(p * 100) + "%";
      $("#upPct").textContent = Math.round(p * 100) + "%";
      if (p >= 1) { bar.classList.add("indet"); $("#upMsg").textContent = "نفحص الملف ونعدّ صفحاته…"; }
    });
    S.copies = 1; S.duplex = false; S.busy = false;
    routeByView();
  } catch (e) {
    S.busy = false;
    // الطلب صار عنده ملف مرفوض: نبدأ طلب جديد للمحاولة الجاية
    if (["unsupported_type", "encrypted", "corrupt", "empty", "too_many_pages", "too_large", "bad_state"].includes(e.code)) clearOrder();
    show("start");
    const eb = $("#upErr"); eb.textContent = errText(e); eb.hidden = false;
  }
}

async function doQuote() {
  if (S.busy) return; S.busy = true;
  const b = $("#toPay"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api("POST", `/orders/${S.order}/quote`, { copies: S.copies, duplex: S.duplex });
    S.view = r.order; S.busy = false; show("pay");
  } catch (e) {
    S.busy = false; b.disabled = false; b.textContent = "متابعة للدفع";
    const eb = $("#optErr"); eb.textContent = errText(e); eb.hidden = false;
    if (e.code === "bad_state") refreshOrder();
  }
}

async function doPay() {
  if (S.busy) return; S.busy = true;
  const b = $("#payBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span> جاري الدفع';
  try {
    S.view = await api("POST", `/orders/${S.order}/pay`, { method: S.method });
    S.busy = false; routeByView();
  } catch (e) {
    S.busy = false; b.disabled = false; b.textContent = `ادفع ${money(S.view.total)} ر.س`;
    const eb = $("#payErr"); eb.textContent = e.code === "bad_state" ? "انتهت مهلة السعر. نحدّثه لك…" : errText(e); eb.hidden = false;
    if (e.code === "bad_state") setTimeout(refreshOrder, 1200);
  }
}

async function doRelease() {
  const ok = await confirmDlg(`أنت عند الطابعة ${S.view.kiosk_id}؟`, "أوراقك بتطلع خلال ثواني، وأي أحد واقف عند الطابعة يقدر ياخذها.", "إيه، أنا عندها — اطبع");
  if (!ok || S.busy) return;
  S.busy = true;
  const b = $("#relBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    S.view = await api("POST", `/orders/${S.order}/release`);
    S.busy = false; routeByView();
  } catch (e) {
    S.busy = false; b.disabled = false; b.textContent = "أنا عند الطابعة — اطبع الآن";
    const eb = $("#relErr"); eb.textContent = errText(e); eb.hidden = false;
  }
}

// ---------- البداية ----------
(async function boot() {
  const q = new URLSearchParams(location.search);
  S.kioskId = (q.get("k") || "").trim();
  if (!/^[A-Za-z0-9_-]{1,20}$/.test(S.kioskId)) return show("nokiosk");
  show("loading");
  try {
    const r = await api("GET", `/kiosks/${encodeURIComponent(S.kioskId)}`);
    S.kiosk = r.kiosk; S.settings = r.settings || {}; renderKiosk();
  } catch (e) {
    S.fatal = e.code === "kiosk_not_found" ? ERR.kiosk_not_found : errText(e);
    return show("fatal");
  }
  const saved = loadSavedOrder();
  if (saved) {
    S.order = saved.id; S.token = saved.token;
    try { S.view = await api("GET", `/orders/${S.order}`); saveOrder(); return routeByView(); }
    catch { clearOrder(); }
  }
  show("start");
})();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.order && ["ready", "printing"].includes(S.screen)) { stopPoll(); refreshOrder(); }
});
</script>
</body>
</html>
