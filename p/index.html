<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171C20">
<meta name="robots" content="noindex">
<title>طابعتي — اطبع من جوالك</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tabaety.css">
<style>
body { min-height: 100dvh }
.app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column }

/* لوحة تحكم الطابعة: أنت واقف قدام هذي الطابعة */
.panel-top { background: var(--machine); color: #E8EDEF; padding: calc(12px + env(safe-area-inset-top)) 16px 0; position: sticky; top: 0; z-index: 10 }
.panel-top .bar { display: flex; align-items: center; gap: 10px; min-height: 40px }
.panel-top .wordmark { font-size: 17px; color: #fff }
.panel-top .wordmark .mark { width: 28px; height: 28px }
.back { margin-inline-start: auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2C353B; background: transparent; color: #fff; display: grid; place-items: center }
.lcd { margin-top: 12px; background: #0E2A2E; border: 1px solid #16444A; border-radius: 10px 10px 0 0; padding: 12px 14px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center }
.lcd .k { grid-row: span 2; font: 800 24px/1 var(--f-head); color: #7BE0E9; direction: ltr; min-width: 52px; text-align: center; border-inline-end: 1px solid #16444A; padding-inline-end: 12px }
.lcd b { font-size: 15px; color: #E9FBFC; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lcd small { font-size: 12.5px; color: #7FA9AE; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lcd .state { grid-row: span 2; display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600 }
.lcd .state i { width: 9px; height: 9px; border-radius: 50% }
.lcd .state.ready { color: #6EE0A0 } .lcd .state.ready i { background: #39D07F; box-shadow: 0 0 10px #39D07F }
.lcd .state.wait { color: #F3C27A } .lcd .state.wait i { background: #E7A84A; box-shadow: 0 0 10px #E7A84A }
.lcd .state.fault { color: #F59C8A } .lcd .state.fault i { background: #EE7B64; box-shadow: 0 0 10px #EE7B64 }
.slotline { height: 8px; background: #050708; margin: 0 -16px; box-shadow: inset 0 3px 5px rgba(0,0,0,.8) }

/* مراحل الطلب */
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 14px 18px 0; font-size: 12px; color: var(--graphite) }
.track span { border-top: 3px solid var(--rule); padding-top: 6px; text-align: center }
.track span.on { border-color: var(--toner); color: var(--toner); font-weight: 600 }

main { flex: 1; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 16px }
main h1 { font-size: 24px; margin: 0 }
.sub { margin: 0; color: var(--graphite); font-size: 15px; line-height: 1.7 }

/* اختيار الملف */
.drop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 30px 18px 26px; text-align: center; cursor: pointer; border: 2px dashed color-mix(in srgb, var(--toner) 25%, var(--rule)); border-radius: 4px; background: var(--sheet) }
.drop:hover, .drop:focus-within { border-color: var(--brand) }
.drop .ic { width: 58px; height: 74px; border-radius: 4px; background: var(--brand-wash); color: var(--brand); display: grid; place-items: center; position: relative; margin-bottom: 4px }
.drop .ic::after { content: ""; position: absolute; top: 0; left: 0; border: 9px solid transparent; border-top-color: var(--desk); border-left-color: var(--desk) }
.drop b { font: 700 18px/1.4 var(--f-head) }
.drop span { font-size: 13.5px; color: var(--graphite) }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
.drop.disabled { opacity: .45; pointer-events: none }
.formats { display: flex; justify-content: center; gap: 6px; margin-top: 6px }
.formats em { font-style: normal; font: 600 11.5px/1 var(--f-body); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 7px; color: var(--graphite) }
.progress { height: 6px; border-radius: 3px; background: var(--rule-soft); overflow: hidden }
.progress div { height: 100%; width: 0; background: var(--brand); transition: width .2s }
.progress.indet div { width: 35%; animation: indet 1.1s ease-in-out infinite }
@keyframes indet { from { transform: translateX(120%) } to { transform: translateX(-300%) } }
.hint { display: flex; gap: 10px; font-size: 13.5px; color: var(--graphite); line-height: 1.7 }
.hint svg { flex: none; margin-top: 3px; color: var(--brand) }
.promises { display: grid; gap: 0; border-top: 1px solid var(--rule) }
.promises div { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); font-size: 14px }
.promises svg { color: var(--brand); flex: none }
.support { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; color: var(--toner); text-decoration: none; font-weight: 600; font-size: 14.5px }

/* الخيارات */
.doc { display: flex; align-items: center; gap: 12px; padding: 14px }
.doc .thumb { width: 40px; height: 52px; border-radius: 3px; background: var(--rule-soft); display: grid; place-items: center; font: 700 10.5px/1 var(--f-body); color: var(--graphite); flex: none; border: 1px solid var(--rule) }
.doc b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: plaintext; text-align: right }
.doc span { font-size: 13px; color: var(--graphite) }
.opt { padding: 16px }
.opt + .opt { border-top: 1px solid var(--rule-soft) }
.opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.opt-row b { font-size: 16px; display: block } .opt-row small { color: var(--graphite); font-size: 13px }
.stepper { display: flex; align-items: center; border: 1px solid var(--rule); border-radius: var(--r-m); overflow: hidden }
.stepper button { width: 48px; height: 48px; border: 0; background: var(--sheet); font-size: 22px; color: var(--toner) }
.stepper button:disabled { color: var(--rule) }
.stepper output { min-width: 44px; text-align: center; font: 800 20px/1 var(--f-head); border-inline: 1px solid var(--rule); align-self: stretch; display: grid; place-items: center }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px }
.seg button { min-height: 64px; border-radius: var(--r-m); border: 1px solid var(--rule); background: var(--sheet); display: flex; align-items: center; gap: 10px; padding: 8px 12px; text-align: right }
.seg button svg { flex: none; color: var(--graphite) }
.seg button b { display: block; font-size: 14.5px } .seg button small { font-size: 12px; color: var(--graphite) }
.seg button[aria-pressed="true"] { border: 2px solid var(--toner); padding: 7px 11px }
.seg button[aria-pressed="true"] svg { color: var(--toner) }
.seg button:disabled { opacity: .4 }
/* معاينة الأوراق: كل مستطيل = ورقة بتطلع من الطابعة */
.sheets { padding: 16px; display: grid; gap: 12px }
.sheets .row-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--graphite) }
.sheets .row-h b { font: 800 20px/1 var(--f-head); color: var(--toner) }
.stack { display: flex; flex-wrap: wrap; gap: 5px; direction: rtl }
.stack i { width: 17px; height: 24px; border-radius: 1.5px; background: var(--sheet); border: 1px solid color-mix(in srgb, var(--toner) 30%, var(--rule)); position: relative }
.stack i.dx::after { content: ""; position: absolute; inset: 3px; border-radius: 1px; background: repeating-linear-gradient(0deg, var(--rule) 0 1px, transparent 1px 3px) }
.stack em { font-style: normal; font-size: 12px; color: var(--graphite); align-self: center; margin-inline-start: 4px }

/* الإيصال */
.receipt { padding: 18px 18px 22px; position: relative }
.receipt.torn { padding-bottom: 30px; -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 0 / 18px 100% repeat-x; mask: radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 0 / 18px 100% repeat-x }
.receipt .line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14.5px }
.receipt .line span:first-child { color: var(--graphite) }
.receipt .line span:last-child { text-align: left }
.receipt hr { border: 0; border-top: 1px dashed var(--rule); margin: 8px 0 }
.receipt .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px }
.receipt .total b:first-child { font-size: 15px }
.receipt .total b:last-child { font: 800 28px/1 var(--f-head) }
.receipt .total small { font: 500 14px var(--f-body); color: var(--graphite) }
.methods { display: grid; gap: 8px }
.method { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: var(--r-m); border: 1px solid var(--rule); background: var(--sheet); text-align: right }
.method b { display: block; font-size: 15px } .method small { font-size: 12.5px; color: var(--graphite) }
.method .radio { margin-inline-start: auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--rule); flex: none }
.method[aria-checked="true"] { border: 2px solid var(--toner); padding: 9px 13px }
.method[aria-checked="true"] .radio { border: 6px solid var(--toner) }
.timer { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; font-weight: 600; color: var(--toner) }

/* جاهز للطباعة */
.ready-card { padding: 22px 18px; text-align: center; display: grid; gap: 10px; justify-items: center }
.ready-card .ok { width: 62px; height: 62px; border-radius: 50%; background: var(--led-ready-wash); color: var(--led-ready); display: grid; place-items: center }
.ready-card h1 { font-size: 23px }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); width: 100%; margin-top: 6px }
.facts div { padding: 12px 4px 0; border-inline-start: 1px solid var(--rule) } .facts div:first-child { border-inline-start: 0 }
.facts span { display: block; font-size: 12px; color: var(--graphite) } .facts b { font: 700 17px/1.4 var(--f-head) }

/* يطبع */
.printing { display: grid; justify-items: center; gap: 14px; padding-top: 8px; text-align: center }
.mini-machine { width: 220px; position: relative; height: 160px }
.mini-machine .body { position: absolute; inset: 0 0 auto; height: 70px; background: var(--machine); border-radius: 14px 14px 6px 6px }
.mini-machine .body::before { content: ""; position: absolute; top: 18px; right: 18px; width: 9px; height: 9px; border-radius: 50%; background: #39D07F; box-shadow: 0 0 10px #39D07F; animation: led-blink 1s infinite }
.mini-machine .mslot { position: absolute; top: 62px; left: 22px; right: 22px; height: 8px; background: #050708; border-radius: 3px }
.mini-machine .out { position: absolute; top: 66px; left: 40px; right: 40px; height: 92px; overflow: hidden }
.mini-machine .out div { height: 92px; background: var(--sheet); border: 1px solid var(--rule); border-top: 0; box-shadow: var(--shadow-sheet); animation: feed 1.4s ease-in-out infinite; padding: 12px 14px; display: grid; gap: 6px; align-content: start }
.mini-machine .out div i { height: 4px; background: var(--rule); border-radius: 2px } .mini-machine .out div i:nth-child(2) { width: 70% } .mini-machine .out div i:nth-child(3) { width: 85% }
@keyframes feed { from { transform: translateY(-100%) } 70%, to { transform: translateY(0) } }

.center { display: grid; justify-items: center; text-align: center; gap: 10px; padding-top: 6px }
.badge { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center }
.badge.ready { background: var(--led-ready-wash); color: var(--led-ready) } .badge.wait { background: var(--led-wait-wash); color: var(--led-wait) }
.badge.fault { background: var(--led-fault-wash); color: var(--led-fault) } .badge.ink { background: var(--toner); color: var(--sheet) }
.stars { display: flex; gap: 4px; justify-content: center }
.stars button { width: 46px; height: 46px; border: 0; background: transparent; color: var(--rule); font-size: 28px }
.stars button.on { color: #E3A22D }
.code-entry { display: flex; gap: 8px }
.code-entry input { flex: 1; min-height: 54px; text-align: center; font: 800 22px var(--f-head); direction: ltr; letter-spacing: 2px }

footer.cta { position: sticky; bottom: 0; z-index: 10; padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--desk) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--rule) }
footer.cta .btn { width: 100%; min-height: 56px; font-size: 16.5px; border-radius: 14px }
footer.cta .btn small { font-weight: 500; opacity: .8 }
</style>
</head>
<body>
<div class="app">
  <header class="panel-top">
    <div class="bar">
      <a class="wordmark" href="/" aria-label="طابعتي — الصفحة الرئيسية"><img class="mark" src="/assets/mark.svg" alt="" width="28" height="28">طابعتي</a>
      <button class="back" id="backBtn" hidden aria-label="رجوع"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="lcd" id="kioskCard" hidden>
      <span class="k" id="kCode">—</span>
      <b id="kLoc">…</b>
      <span class="state" id="kPill"><i></i><span></span></span>
      <small id="kSub"></small>
    </div>
    <div class="slotline" aria-hidden="true"></div>
  </header>
  <div class="track" id="steps" hidden aria-hidden="true"><span>الملف</span><span>الخيارات</span><span>الدفع</span><span>الطباعة</span></div>
  <main id="main" aria-live="polite"></main>
  <footer class="cta" id="cta" hidden></footer>
</div>

<dialog class="dlg" id="confirmDlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="acts">
    <button class="btn btn-go" id="dlgYes"></button>
    <button class="btn btn-line" id="dlgNo">لا، بعدين</button>
  </div>
</dialog>

<script>
"use strict";
const API = "https://dloicztspjligjjowhps.supabase.co/functions/v1/public-api";
const MAX_BYTES = 20 * 1024 * 1024;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => Number(n || 0).toFixed(2);
const KIOSK_REASON = {
  paused: "الطابعة متوقفة مؤقتًا للصيانة. جرّب بعد شوي.",
  offline: "الطابعة مو متصلة الحين. جرّب بعد دقائق، أو تواصل معنا.",
  printer_error: "الطابعة فيها عطل (ورق منحشر أو باب مفتوح). بلّغنا وبنصلحها.",
  low_ink: "الحبر قارب يخلص، وما نبي نطبع لك أوراق باهتة. بنعبّيه قريب.",
  no_paper: "الورق خلص في هذي الطابعة. بنعبّيها قريب.",
  disabled: "هذي الطابعة خارج الخدمة حاليًا.",
};
const ERR = {
  unsupported_type: "نوع الملف غير مدعوم. نقبل PDF والصور (JPG وPNG). ملف Word؟ احفظه PDF من «مشاركة» أو «طباعة» ثم ارفعه.",
  encrypted: "الملف مقفول بكلمة مرور. افتح القفل واحفظه من جديد ثم ارفعه.",
  corrupt: "ما قدرنا نقرأ الملف، يمكن يكون تالف. جرّب تحفظه من جديد.",
  empty: "الملف فاضي.",
  too_large: "الملف أكبر من 20 ميجا. صغّر حجمه أو قسّمه.",
  too_many_pages: "الملف فيه صفحات أكثر من المسموح لهذي الطابعة",
  rate_limited: "طلبات كثيرة من نفس الجهاز. انتظر دقائق وجرّب.",
  kiosk_unavailable: "الطابعة غير متاحة الحين.",
  kiosk_not_found: "ما لقينا هذي الطابعة. تأكد من الكود المكتوب عليها.",
  supplies: "الورق أو الحبر ما يكفي لطلبك الحين. جرّب عدد نسخ أقل.",
  bad_copies: "عدد النسخ غير مسموح.",
  no_duplex: "هذي الطابعة ما تطبع على الوجهين.",
  mock_disabled: "الدفع غير متاح حاليًا.",
  bad_state: "صار تغيير على الطلب. حدّث الصفحة.",
  unauthorized: "رابط الطلب غير صالح.",
  server_error: "صار خطأ عندنا. جرّب مرة ثانية.",
  network: "ما فيه اتصال بالإنترنت. تأكد من النت وجرّب.",
};

const S = { kioskId: null, kiosk: null, settings: {}, order: null, token: null, view: null,
  screen: "boot", copies: 1, duplex: false, method: "apple", upload: null, busy: false, rating: 0, poll: null };

// ---------- الاتصال ----------
async function api(method, path, body, extra = {}) {
  const headers = { ...extra };
  if (S.token) headers["X-Order-Token"] = S.token;
  let payload;
  if (body instanceof Blob || body instanceof ArrayBuffer) payload = body;
  else if (body) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, { method, headers, body: payload }); }
  catch { throw Object.assign(new Error("network"), { code: "network" }); }
  let data = {};
  try { data = await res.json(); } catch { /* فاضي */ }
  if (!res.ok) throw Object.assign(new Error(data.error || "server_error"), { code: data.error || "server_error", data, status: res.status });
  return data;
}

function uploadFile(blob, name, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", `${API}/orders/${S.order}/file`);
    x.setRequestHeader("X-Order-Token", S.token);
    x.setRequestHeader("X-File-Name", encodeURIComponent(name));
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => {
      let d = {}; try { d = JSON.parse(x.responseText); } catch { /* */ }
      x.status === 200 ? resolve(d) : reject(Object.assign(new Error(d.error || "server_error"), { code: d.error || "server_error", data: d }));
    };
    x.onerror = () => reject(Object.assign(new Error("network"), { code: "network" }));
    x.send(blob);
  });
}

function errText(e) {
  const c = e?.code || "server_error";
  if (c === "too_many_pages" && e.data?.max) return `${ERR.too_many_pages} (${e.data.max} صفحة كحد أقصى).`;
  if (c === "kiosk_unavailable" && e.data?.status) return KIOSK_REASON[e.data.status] || ERR.kiosk_unavailable;
  if (c === "supplies" && e.data?.reason === "offline") return KIOSK_REASON.offline;
  return ERR[c] || ERR.server_error;
}

// ---------- حفظ الطلب في الجوال (يرجع له لو قفل الصفحة) ----------
const storeKey = () => `tabaety.order.${S.kioskId}`;
function saveOrder() {
  try { localStorage.setItem(storeKey(), JSON.stringify({ id: S.order, token: S.token, at: Date.now() })); } catch { /* وضع خاص */ }
  history.replaceState(null, "", `?k=${encodeURIComponent(S.kioskId)}#o=${S.order}.${S.token}`);
}
function clearOrder() {
  try { localStorage.removeItem(storeKey()); } catch { /* */ }
  S.order = null; S.token = null; S.view = null;
  history.replaceState(null, "", `?k=${encodeURIComponent(S.kioskId)}`);
}
function loadSavedOrder() {
  const m = location.hash.match(/#o=([0-9a-f-]{36})\.([A-Za-z0-9_-]{20,100})/);
  if (m) return { id: m[1], token: m[2] };
  try {
    const s = JSON.parse(localStorage.getItem(storeKey()) || "null");
    if (s && Date.now() - s.at < 3 * 3600 * 1000) return s;
  } catch { /* */ }
  return null;
}

// ---------- الصور ← JPEG نظيف (يحل HEIC من الآيفون ويصغّر الحجم) ----------
async function imageToJpeg(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    bmp = await new Promise((res, rej) => {
      const img = new Image(); const u = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(u); res(img); };
      img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); };
      img.src = u;
    });
  }
  const maxSide = 2480;
  const w0 = bmp.width, h0 = bmp.height;
  const sc = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
}

// ---------- الواجهة ----------
const SVG = (d, w = 22, sw = 2) => `<svg aria-hidden="true" width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  up: '<path d="M12 16V5"/><path d="M7 10l5-5 5 5"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function confirmDlg(title, text, yes) {
  return new Promise((resolve) => {
    const d = $("#confirmDlg");
    $("#dlgTitle").textContent = title; $("#dlgText").textContent = text; $("#dlgYes").textContent = yes;
    const done = (v) => { d.close(); resolve(v); };
    $("#dlgYes").onclick = () => done(true); $("#dlgNo").onclick = () => done(false);
    d.oncancel = () => resolve(false);

  });
}

  return n ? `https://wa.me/${n}?text=${encodeURIComponent(t)}` : "#";
}
function renderKiosk() {

  const [cls, label] = KSTATE[k.status] || ["fault", "غير متاحة"];

}
function setSteps(n) {

}
function setCta(html) { const f = $("#cta"); f.hidden = !html; f.innerHTML = html || ""; }

}

let countdownTimer = null;
function tickCountdown(sel, iso, onEnd) {
  clearInterval(countdownTimer);
  const end = Date.parse(iso || "");
  if (!end) return;
  const f = () => {
    const el = $(sel); if (!el) { clearInterval(countdownTimer); return; }
    const s = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (s <= 0) { clearInterval(countdownTimer); onEnd?.(); }
  };
  f(); countdownTimer = setInterval(f, 1000);
}

function routeByView() {
  const st = S.view.stage;
  if (S.view.kiosk) { S.kiosk = S.view.kiosk; renderKiosk(); }
  if (st === "new") return show("start");
  if (st === "uploaded" || st === "quoted") { S.copies = S.view.copies || 1; S.duplex = !!S.view.duplex; return show("options"); }
  if (st === "ready") return show("ready");
  if (st === "queued" || st === "printing") return show("printing");
  if (st === "done") return show("done");
  return show("problem");
}

// ---------- الأفعال ----------
async function refreshKioskOnStart() {
  try {
    const r = await api("GET", `/kiosks/${encodeURIComponent(S.kioskId)}`);
    S.kiosk = r.kiosk; S.settings = r.settings || {}; renderKiosk();
    if (!S.order) show("start");
  } catch (e) {
    if (e.code === "kiosk_not_found") { S.fatal = ERR.kiosk_not_found; show("fatal"); }
    else if (S.screen === "start") S.poll = setTimeout(refreshKioskOnStart, 15000);
  }
}

async function refreshOrder() {
  try {
    S.view = await api("GET", `/orders/${S.order}`);
    const before = S.screen; routeByView();
    if (before === S.screen && S.screen === "printing") { /* استمرار الاستطلاع داخل after */ }
  } catch (e) {
    if (e.code === "unauthorized" || e.status === 404) { clearOrder(); return refreshKioskOnStart(); }
    S.poll = setTimeout(refreshOrder, 4000);
  }
}

async function onFile(file) {
  if (!file || S.busy) return;
  const box = $("#upBox"), errBox = $("#upErr");
  errBox.hidden = true;
  const name = file.name || "ملف";
  const ext = name.split(".").pop().toLowerCase();
  const isPdf = file.type === "application/pdf" || ext === "pdf";
  const isImg = (file.type || "").startsWith("image/") || ["jpg", "jpeg", "png", "heic", "heif", "webp"].includes(ext);
  if (["doc", "docx", "ppt", "pptx", "xls", "xlsx", "txt", "pages", "key"].includes(ext)) {
    errBox.textContent = "ملفات Word وPowerPoint نحتاجها PDF. افتح الملف في جوالك، ثم «مشاركة» أو «طباعة»، ثم «حفظ PDF»، وبعدها ارفعه.";
    errBox.hidden = false; return;
  }
  if (!isPdf && !isImg) { errBox.textContent = ERR.unsupported_type; errBox.hidden = false; return; }

  S.busy = true; $("#drop").classList.add("disabled"); box.hidden = false;
  $("#upName").textContent = name; $("#upPct").textContent = ""; $("#upMsg").textContent = "نجهّز الملف…";
  const bar = $("#upBar"); bar.classList.add("indet");
  try {
    let blob = file, sendName = name;
    if (isImg) {
      blob = await imageToJpeg(file);
      if (!blob) throw Object.assign(new Error("corrupt"), { code: "corrupt" });
      sendName = name.replace(/\.[^.]+$/, "") + ".jpg";
    }
    if (blob.size > MAX_BYTES) throw Object.assign(new Error("too_large"), { code: "too_large" });
    if (!S.order) {
      const r = await api("POST", "/orders", { kiosk_id: S.kioskId });
      S.order = r.order_id; S.token = r.token; saveOrder();
    }
    bar.classList.remove("indet"); $("#upMsg").textContent = "نرفع الملف…";
    S.view = await uploadFile(blob, sendName, (p) => {
      bar.firstElementChild.style.width = Math.round(p * 100) + "%";
      $("#upPct").textContent = Math.round(p * 100) + "%";
      if (p >= 1) { bar.classList.add("indet"); $("#upMsg").textContent = "نفحص الملف ونعدّ صفحاته…"; }
    });
    S.copies = 1; S.duplex = false; S.busy = false;
    routeByView();
  } catch (e) {
    S.busy = false;
    // الطلب صار عنده ملف مرفوض: نبدأ طلب جديد للمحاولة الجاية
    if (["unsupported_type", "encrypted", "corrupt", "empty", "too_many_pages", "too_large", "bad_state"].includes(e.code)) clearOrder();
    show("start");
    const eb = $("#upErr"); eb.textContent = errText(e); eb.hidden = false;
  }
}

async function doQuote() {
  if (S.busy) return; S.busy = true;
  const b = $("#toPay"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api("POST", `/orders/${S.order}/quote`, { copies: S.copies, duplex: S.duplex });
    S.view = r.order; S.busy = false; show("pay");
  } catch (e) {
    S.busy = false; b.disabled = false; b.textContent = "متابعة للدفع";
    const eb = $("#optErr"); eb.textContent = errText(e); eb.hidden = false;
    if (e.code === "bad_state") refreshOrder();
  }
}

async function doPay() {
  if (S.busy) return; S.busy = true;
  const b = $("#payBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span> جاري الدفع';
  try {
    S.view = await api("POST", `/orders/${S.order}/pay`, { method: S.method });
    S.busy = false; routeByView();
  } catch (e) {
    S.busy = false; b.disabled = false; b.textContent = `ادفع ${money(S.view.total)} ر.س`;
    const eb = $("#payErr"); eb.textContent = e.code === "bad_state" ? "انتهت مدة السعر. نحدّثه لك…" : errText(e); eb.hidden = false;
    if (e.code === "bad_state") setTimeout(refreshOrder, 1200);
  }
}

async function doRelease() {
  const ok = await confirmDlg(`أنت عند الطابعة ${S.view.kiosk_id}؟`, "أوراقك تطلع خلال ثواني، وأي أحد واقف عندها يقدر ياخذها.", "إيه، أنا عندها. اطبع");
  if (!ok || S.busy) return;
  S.busy = true;
  const b = $("#relBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    S.view = await api("POST", `/orders/${S.order}/release`);
    S.busy = false; routeByView();
  } catch (e) {
    S.busy = false; b.disabled = false; b.textContent = "أنا عند الطابعة، اطبع الآن";
    const eb = $("#relErr"); eb.textContent = errText(e); eb.hidden = false;
  }
}

// ---------- البداية ----------
(async function boot() {
  const q = new URLSearchParams(location.search);
  S.kioskId = (q.get("k") || "").trim();
  if (!/^[A-Za-z0-9_-]{1,20}$/.test(S.kioskId)) return show("nokiosk");
  show("loading");
  try {
    const r = await api("GET", `/kiosks/${encodeURIComponent(S.kioskId)}`);
    S.kiosk = r.kiosk; S.settings = r.settings || {}; renderKiosk();
  } catch (e) {
    S.fatal = e.code === "kiosk_not_found" ? ERR.kiosk_not_found : errText(e);
    return show("fatal");
  }
  const saved = loadSavedOrder();
  if (saved) {
    S.order = saved.id; S.token = saved.token;
    try { S.view = await api("GET", `/orders/${S.order}`); saveOrder(); return routeByView(); }
    catch { clearOrder(); }
  }
  show("start");
})();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.order && ["ready", "printing"].includes(S.screen)) { stopPoll(); refreshOrder(); }
});
</script>
</body>
</html>
