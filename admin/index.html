<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة طابعتي</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#0A6B74">
<script>
// الوضع الليلي افتراضيًا، ويتذكر اختيارك
(function(){var t="dark";try{t=localStorage.getItem("tabaety.theme")||"dark"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181B; --ink-2:#5E6A73; --ink-3:#8A959C; --line:#DCE2E5; --line-2:#EBEFF1; --ground:#F4F6F6; --card:#FFFFFF;
  --accent:#0A6B74; --accent-ink:#084F56; --accent-tint:#E1F0F1;
  --ok:#1D7F48; --ok-tint:#E3F3E9; --warn:#8A5A0B; --warn-tint:#FBF0DC; --bad:#B83A26; --bad-tint:#FBE7E3; --mute-tint:#EEF1F2;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --on-accent:#FFFFFF; --hover-row:#FAFBFB; --danger-line:#EBC3BB; --bar-warn:#D99A2B; --toast:#14181B; --toast-ink:#FFFFFF; --logo:#0A6B74;
  color-scheme:light;
}
/* الوضع الليلي (الافتراضي). يتبدّل من زر القمر/الشمس */
:root[data-theme="dark"]{
  --ink:#E6ECEE; --ink-2:#9AA6AD; --ink-3:#6E7A82; --line:#28323A; --line-2:#1F272D; --ground:#0D1114; --card:#151B1F;
  --accent:#3BB0BB; --accent-ink:#5BC6D0; --accent-tint:#12313A;
  --ok:#4CC183; --ok-tint:#12291E; --warn:#E0A84A; --warn-tint:#2C2312; --bad:#EF7A63; --bad-tint:#33190F; --mute-tint:#1D252A;
  --on-accent:#06191C; --hover-row:#1A2227; --danger-line:#5A2A20; --bar-warn:#E0A84A; --toast:#E6ECEE; --toast-ink:#0D1114; --logo:#0E7C86;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--mono)} .ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--ink-2)} .small{font-size:12px}

/* تسجيل الدخول */
.login{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:22px}

/* الهيكل */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
aside.nav{background:var(--card);border-left:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--logo);color:#fff;display:grid;place-items:center}
.brand b{font-size:16px;display:block} .brand small{font-size:11px;color:var(--ink-2)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:right;font-weight:500;color:var(--ink-2)}
.nav button:hover{background:var(--ground);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-tint);color:var(--accent);font-weight:600}
.nav .count{margin-inline-start:auto;font:600 11px var(--mono);background:var(--bad);color:#fff;border-radius:99px;padding:2px 7px}
.nav .foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live-dot.off i{background:var(--bad)}
main.page{padding:22px 26px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:22px} .head p{margin:4px 0 0;color:var(--ink-2)}
.tabs-m,.mtop{display:none}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}

/* عناصر عامة */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi span{font-size:12px;color:var(--ink-2);display:block} .kpi b{font:600 26px var(--mono);display:block;margin-top:4px} .kpi small{font-size:12px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--danger-line)} .btn.danger:hover{background:var(--bad-tint)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:var(--ok-tint)} .warn{color:var(--warn);background:var(--warn-tint)} .bad{color:var(--bad);background:var(--bad-tint)} .mute{color:var(--ink-2);background:var(--mute-tint)} .info{color:var(--accent);background:var(--accent-tint)}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden} .bar div{height:100%;border-radius:4px;background:var(--accent)}
.bar.warn div{background:var(--bar-warn)} .bar.bad div{background:var(--bad)}
.alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px}
.alert b{font-weight:600}
.alert .btn{margin-inline-start:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink-2);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover-row)}
.table-wrap{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input.f,select.f,textarea.f{min-height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card)}
textarea.f{padding:8px 10px;min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.form label small{font-weight:400;color:var(--ink-2);font-size:12px}
.form .full{grid-column:1/-1}
.form .check{flex-direction:row;align-items:center;gap:8px}
.savebar{position:sticky;bottom:0;background:var(--card);padding:12px 0 4px;margin-bottom:-4px;border-top:1px solid var(--line-2);z-index:2}
.form h3{grid-column:1/-1;margin:8px 0 0;font-size:13px;color:var(--ink-2);font-weight:600;border-top:1px solid var(--line-2);padding-top:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* بطاقة الطابعة */
.pcard{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.pcard:hover{border-color:var(--ink-3)}
.pcard .top{display:flex;align-items:center;gap:10px}
.code{font:600 18px var(--mono);background:var(--accent-tint);color:var(--accent);border-radius:9px;padding:4px 9px;direction:ltr}
.pcard .loc{flex:1;min-width:0} .pcard .loc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .pcard .loc span{font-size:12px;color:var(--ink-2)}
.meter{display:flex;flex-direction:column;gap:5px} .meter .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)} .meter .row b{color:var(--ink);font-family:var(--mono)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* الدرج الجانبي */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(760px,100%);background:var(--ground);z-index:41;overflow-y:auto;box-shadow:20px 0 60px rgba(0,0,0,.15)}
.drawer .dh{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.drawer .dh h2{margin:0;font-size:18px;flex:1;min-width:0}
.drawer .db{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);background:var(--card);padding:0 18px;position:sticky;top:63px;z-index:1;overflow-x:auto}
.subtabs button{border:0;background:transparent;padding:12px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px} .kv dt{color:var(--ink-2)} .kv dd{margin:0}
.sensors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sensor{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px} .sensor span{font-size:11px;color:var(--ink-2);display:block} .sensor b{font:600 18px var(--mono)}
.timeline{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);margin-inline-start:6px;padding-inline-start:14px}
.timeline div{position:relative;padding:4px 0 10px;font-size:13px}
.timeline div::before{content:"";position:absolute;inset-inline-start:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline div.off::before{background:var(--line)}
.qr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:inline-block}
.qr svg{display:block;width:150px;height:150px}
.pairbox{font:600 32px var(--mono);letter-spacing:6px;background:var(--accent-tint);color:var(--accent);border-radius:12px;padding:12px 18px;text-align:center;direction:ltr}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .col div{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart .col span{font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
.toast.err{background:var(--bad)}
dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:20px;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,24,27,.45)}
dialog h3{margin:0 0 8px;font-size:17px} dialog p{margin:0 0 14px;color:var(--ink-2);line-height:1.6}
dialog .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
.demo-banner{background:var(--warn-tint);color:var(--warn);padding:8px 14px;font-size:13px;text-align:center}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  aside.nav{display:none}
  /* شريط علوي صغير */
  .mtop{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .mtop .logo{width:30px;height:30px;border-radius:8px;background:var(--logo);color:#fff;display:grid;place-items:center}
  .mtop b{font-size:15px;margin-inline-end:auto}
  .mtop .live-dot{margin-inline-end:4px}
  /* شريط التنقل تحت */
  .tabs-m{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs-m button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--ink-2);position:relative;min-height:52px}
  .tabs-m button svg{width:22px;height:22px}
  .tabs-m button[aria-current="page"]{color:var(--accent)}
  .tabs-m button[aria-current="page"] svg{background:var(--accent-tint);border-radius:10px;padding:3px;width:36px;height:28px}
  .tabs-m .count{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);font:600 10px var(--mono);background:var(--bad);color:#fff;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
  main.page{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .head{margin-bottom:14px} .head h1{font-size:20px}
  .head .toolbar{width:100%} .head .toolbar .btn{flex:1}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3,.g2{grid-template-columns:1fr}
  .kpi b{font-size:22px}
  .form{grid-template-columns:1fr}
  .sensors{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{display:grid;grid-template-columns:1fr 1fr} .filters #fq{grid-column:1/-1}
  .card{padding:14px}
  /* الدرج يصير شاشة كاملة */
  .drawer{width:100%;box-shadow:none}
  .drawer .dh{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .drawer .dh h2{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .subtabs{top:57px;padding:0 8px}
  .subtabs button{padding:12px 10px;font-size:13px}
  .drawer .db{padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
  .toolbar .btn{flex:1 1 auto}
  dialog .acts{flex-direction:column} dialog .acts .btn{width:100%;min-height:46px}
  .btn{min-height:42px}
}
/* الجداول تتحول لبطاقات على الجوال */
@media (max-width:720px){
  table.rt thead{display:none}
  table.rt, table.rt tbody{display:block}
  table.rt tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}
  table.rt td{border:0;padding:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;max-width:none!important;white-space:normal!important}
  table.rt td::before{content:attr(data-label);font-size:11px;color:var(--ink-2);font-weight:500}
  table.rt td[data-label=""]::before{display:none}
  table.rt td:last-child:has(.btn){grid-column:1/-1}
  .table-wrap{overflow:visible}
  .card[style*="padding:4px"]{padding:4px 8px!important;background:transparent;border:0}
}
.loc-state{padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.7;border:1px solid transparent}
.loc-state.ok{background:#E8F6F1;color:#11604A;border-color:#BFE5D6}
.loc-state.warn{background:#FDF4E3;color:#7A5410;border-color:#F1DDB0}
.loc-state.bad{background:#FDECE8;color:#8A2E1C;border-color:#F4C9BE}
.loc-state a{color:inherit;font-weight:700;margin-inline-start:6px}
:root[data-theme="dark"] .loc-state.ok{background:#12322A;color:#8EE0C2;border-color:#1E4F41}
:root[data-theme="dark"] .loc-state.warn{background:#3A2E14;color:#F1CC80;border-color:#5A4720}
:root[data-theme="dark"] .loc-state.bad{background:#3B1D17;color:#F4A898;border-color:#5C2C22}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner" hidden>اختبار محلي: بيانات وهمية.</div>

<section class="login" id="login" hidden>
  <form id="loginForm">
    <div class="brand" style="padding:0"><span class="logo"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 100 100" fill="currentColor"><path d="M30 6H70V20H30Z" fill-opacity=".45"/><path d="M22 20H78A18 18 0 0 1 96 38V48A18 18 0 0 1 78 66H22A18 18 0 0 1 4 48V38A18 18 0 0 1 22 20ZM30 52H70A2 2 0 0 1 72 54V58A2 2 0 0 1 70 60H30A2 2 0 0 1 28 58V54A2 2 0 0 1 30 52Z" fill-rule="evenodd"/><path d="M34 56H66V88L58 96H34Z"/></svg></span><span><b>لوحة طابعتي</b><small>للمدراء فقط</small></span></div>
    <h1>تسجيل الدخول</h1>
    <label class="form" style="display:flex;flex-direction:column;gap:5px;font-weight:500">الإيميل<input class="f" id="email" type="email" autocomplete="username" required dir="ltr"></label>
    <label class="form" style="display:flex;flex-direction:column;gap:5px;font-weight:500">كلمة المرور<input class="f" id="pass" type="password" autocomplete="current-password" required dir="ltr"></label>
    <div id="loginErr" class="alert bad" hidden></div>
    <button class="btn primary" id="loginBtn" style="min-height:44px">دخول</button>
  </form>
</section>

<div class="shell" id="shell" hidden>
  <aside class="nav" aria-label="القائمة">
    <div class="brand"><span class="logo"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 100 100" fill="currentColor"><path d="M30 6H70V20H30Z" fill-opacity=".45"/><path d="M22 20H78A18 18 0 0 1 96 38V48A18 18 0 0 1 78 66H22A18 18 0 0 1 4 48V38A18 18 0 0 1 22 20ZM30 52H70A2 2 0 0 1 72 54V58A2 2 0 0 1 70 60H30A2 2 0 0 1 28 58V54A2 2 0 0 1 30 52Z" fill-rule="evenodd"/><path d="M34 56H66V88L58 96H34Z"/></svg></span><span><b>لوحة طابعتي</b><small id="who"></small></span></div>
    <div id="navBtns"></div>
    <div class="foot">
      <span class="live-dot" id="liveDot"><i></i><span>تحديث لحظي</span></span>
      <button class="btn sm" data-theme-toggle>الوضع النهاري</button>
      <button class="btn sm" id="logoutBtn">تسجيل خروج</button>
    </div>
  </aside>
  <div style="min-width:0">
    <header class="mtop">
      <span class="logo"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 100 100" fill="currentColor"><path d="M30 6H70V20H30Z" fill-opacity=".45"/><path d="M22 20H78A18 18 0 0 1 96 38V48A18 18 0 0 1 78 66H22A18 18 0 0 1 4 48V38A18 18 0 0 1 22 20ZM30 52H70A2 2 0 0 1 72 54V58A2 2 0 0 1 70 60H30A2 2 0 0 1 28 58V54A2 2 0 0 1 30 52Z" fill-rule="evenodd"/><path d="M34 56H66V88L58 96H34Z"/></svg></span>
      <b>لوحة طابعتي</b>
      <span class="live-dot" id="liveDotM"><i></i></span>
      <button class="icon-btn" data-theme-toggle aria-label="تبديل الوضع الليلي/النهاري"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="icon-btn" id="logoutBtnM" aria-label="تسجيل خروج"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg></button>
    </header>
    <main class="page" id="page"></main>
    <nav class="tabs-m" id="tabsM" aria-label="القائمة"></nav>
  </div>

function kioskStatus(k) {
  if (k.archived_at) return ["mute", "مؤرشفة", "archived"];
  if (!k.is_enabled) return ["mute", "موقوفة من اللوحة", "disabled"];
  if (!k.agent_token_hash && !k.device_id) return ["mute", "غير مربوطة", "unpaired"];
  if (!k.last_ping || Date.now() - Date.parse(k.last_ping) > 180000) return ["bad", "غير متصلة", "offline"];
  if (k.agent_paused) return ["warn", "متوقفة مؤقتًا", "paused"];
  const ps = k.printer_state || {};
  if (ps.can_print === false || ps.ok === false) return ["bad", "عطل في الطابعة", "printer_error"];
  if ((k.ink_level_percent ?? 0) < k.ink_min_percent) return ["warn", "الحبر منخفض", "low_ink"];
  if (paperAvail(k) <= 0) return ["bad", "الورق خلص", "no_paper"];
  if (k.current_paper_count <= k.low_paper_alert) return ["warn", "الورق قليل", "low_paper"];
  return ["ok", "جاهزة", "ok"];
}
const paperAvail = (k) => Math.max(0, (k.current_paper_count || 0) - (k.paper_reserved || 0) - (k.paper_safety_margin || 0));
function orderStatus(o) {
  if (o.refund_status === "needs_refund") return ["bad", "يحتاج استرجاع"];
  if (o.refund_status === "refunded") return ["mute", "مسترجع"];
  if (o.payment_status === "expired") return ["mute", "انتهى بدون دفع"];
  if (o.payment_status === "cancelled" || o.print_status === "cancelled") return ["mute", "ملغي"];
  if (o.print_status === "printed") return /^وضع التجربة/.test(o.error_message || "") ? ["info", "تم (تجربة)"] : ["ok", "تمت الطباعة"];
  if (o.print_status === "failed") return ["bad", "فشل"];
  if (o.print_status === "retryable_failed") return ["warn", "إعادة محاولة"];
  if (o.print_status === "printing") return ["info", "يطبع"];
  if (o.payment_status === "paid" && o.print_status === "queued") return o.source === "web" && !o.released_at ? ["warn", "ينتظر العميل"] : ["info", "في الطابور"];

}

function filteredOrders() {
  const f = S.filters, since = Date.now() - Number(f.days) * 86400000, q = f.q.trim().toUpperCase().replace(/^#/, "");
  return S.orders.filter((o) => Date.parse(o.created_at) >= since
    && (!f.kiosk || o.kiosk_id === f.kiosk) && (!f.source || o.source === f.source)
    && (!f.status || orderStatus(o)[1] === f.status)
    && (!q || ref(o.id).startsWith(q) || (o.original_name || "").toUpperCase().includes(q)));
}
PAGES.orders = () => {
  const list = filteredOrders();
  const statuses = [...new Set(S.orders.map((o) => orderStatus(o)[1]))];
  const f = S.filters;
  return `
  <div class="head"><div><h1>الطلبات</h1><p>${list.length} طلب في الفترة المختارة.</p></div>
    <div class="toolbar"><button class="btn" id="csvBtn">تصدير CSV</button></div></div>
  <div class="filters">
    <input class="f" id="fq" placeholder="رقم الطلب أو اسم الملف" value="${esc(f.q)}" aria-label="بحث">
    <select class="f" id="fk" aria-label="الطابعة"><option value="">كل الطابعات</option>${S.kiosks.map((k) => `<option ${f.kiosk === k.kiosk_id ? "selected" : ""}>${esc(k.kiosk_id)}</option>`).join("")}</select>
    <select class="f" id="fs" aria-label="الحالة"><option value="">كل الحالات</option>${statuses.map((s) => `<option ${f.status === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
    <select class="f" id="fo" aria-label="المصدر"><option value="">كل المصادر</option>${Object.entries(SOURCE).map(([k, v]) => `<option value="${k}" ${f.source === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    <select class="f" id="fd" aria-label="الفترة">${[["1", "اليوم وأمس"], ["7", "آخر 7 أيام"], ["30", "آخر 30 يوم"]].map(([v, l]) => `<option value="${v}" ${f.days === v ? "selected" : ""}>${l}</option>`).join("")}</select>
  </div>
  <div class="card" style="padding:4px 6px">${ordersTable(list)}</div>`;
};
PAGES_AFTER.orders = () => {
  const bind = (id, key) => { const el = $(id); el.oninput = el.onchange = () => { S.filters[key] = el.value; const pos = el.selectionStart; render(); const n = $(id); n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); }; };
  bind("#fq", "q"); bind("#fk", "kiosk"); bind("#fs", "status"); bind("#fo", "source"); bind("#fd", "days");
  $("#csvBtn").onclick = () => {
    const rows = [["ref", "id", "kiosk", "source", "file", "pages", "copies", "duplex", "sheets", "amount", "status", "refund", "created", "paid", "printed"]];
    for (const o of filteredOrders()) rows.push([ref(o.id), o.id, o.kiosk_id, o.source, o.original_name || "", o.total_pages, o.copies, o.duplex, o.sheets_needed ?? "", o.total_amount, orderStatus(o)[1], o.refund_status || "", o.created_at, o.paid_at || "", o.printed_at || ""]);
    const csv = "﻿" + rows.map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `tabaety-orders-${dayKey(Date.now())}.csv`; a.click();
  };
};

async function refundOrder(id) {
  const note = await ask({ title: `تأكيد استرجاع #${ref(id)}`, ok: "تم الاسترجاع",
    body: `<p>تأكد إنك رجّعت المبلغ للعميل من بوابة الدفع.</p><form class="form" style="grid-template-columns:1fr"><label>ملاحظة (اختياري)<input class="f" id="rnote" placeholder="مثلًا: رقم عملية الاسترجاع"></label></form>`,
    form: () => $("#rnote").value });
  if (note === null) return;
  await act(() => S.db.rpc("admin_mark_refunded", { p_order: id, p_note: note }), "تم تسجيل الاسترجاع");
}

/* ================= درج الطابعة ================= */
function openKiosk(kid, sub = "status") { S.drawer = { type: "kiosk", id: kid, sub }; renderDrawer(); }
function openNewKiosk() { S.drawer = { type: "kiosk", id: null, sub: "settings" }; renderDrawer(); }
function openOrder(id) { S.drawer = { type: "order", id }; renderDrawer(); }
function closeDrawer() { S.drawer = null; $("#drawerRoot").innerHTML = ""; document.body.style.overflow = ""; }

function renderDrawer() {
  const d = S.drawer; if (!d) return;
  const root = $("#drawerRoot");
  const keepScroll = root.querySelector(".drawer")?.scrollTop || 0;
  // لا نعيد رسم نموذج مفتوح أثناء الكتابة
  if (d.type === "kiosk" && d.sub === "settings" && root.querySelector("#kForm") && document.activeElement?.closest("#kForm")) return;
  root.innerHTML = `<div class="drawer-bg" id="dbg"></div><section class="drawer" role="dialog" aria-modal="true" aria-label="تفاصيل">${d.type === "kiosk" ? kioskDrawer(d) : orderDrawer(d)}</section>`;
  root.querySelector(".drawer").scrollTop = keepScroll;
  labelTables(root);
  document.body.style.overflow = "hidden";
  $("#dbg").onclick = closeDrawer; $("#dClose").onclick = closeDrawer;
  (d.type === "kiosk" ? kioskDrawerAfter : orderDrawerAfter)(d);
}

function kioskDrawer(d) {
  const k = S.kiosks.find((x) => x.kiosk_id === d.id);
  const isNew = !k;
  const SUBS = [["status", "الحالة"], ["supplies", "الورق والحبر"], ["settings", "الإعدادات"], ["device", "الجهاز والربط"], ["qr", "الباركود والملصق"], ["orders", "الطلبات"], ["tools", "أدوات"]];
  const head = `<div class="dh">${isNew ? "" : `<span class="code">${esc(k.kiosk_id)}</span>`}<h2>${isNew ? "طابعة جديدة" : esc(k.location_name)}</h2>${isNew ? "" : pill(kioskStatus(k))}<button class="btn sm" id="dClose" aria-label="إغلاق">إغلاق</button></div>`;
  if (isNew) return head + `<div class="db">${kioskForm(null)}</div>`;
  const tabs = `<div class="subtabs" role="tablist">${SUBS.map(([id, l]) => `<button role="tab" data-sub="${id}" aria-selected="${d.sub === id}">${l}</button>`).join("")}</div>`;
  return head + tabs + `<div class="db">${KSUB[d.sub](k)}</div>`;
}

        <div class="qr">${qrSvg(customerLink(k.kiosk_id))}</div>

          <a class="ltr mono small" style="word-break:break-all" href="${customerLink(k.kiosk_id)}" target="_blank" rel="noopener">${customerLink(k.kiosk_id)}</a>
          <div class="toolbar"><button class="btn" id="copyLink">نسخ الرابط</button><a class="btn" href="${customerLink(k.kiosk_id)}" target="_blank" rel="noopener">فتح الصفحة</a></div>
        </div>
      </div>
    </div>
    <div class="card"><h2>ملصق الطابعة (A6)</h2>
      <p class="small muted" style="margin:0 0 12px">ملصق جاهز للطباعة فيه الباركود ورقم الطابعة والسعر والخطوات ورقم الدعم. اطبعه على ورق ملصقات أو A4 وقصّه.</p>
      <div class="toolbar"><button class="btn primary" id="sticker">افتح الملصق للطباعة</button><button class="btn" id="stickerTest">اطبعه على الطابعة نفسها</button></div>
    </div>`,
  orders: (k) => {
    const list = S.orders.filter((o) => o.kiosk_id === k.kiosk_id).slice(0, 50);
    return `<div class="card" style="padding:4px 6px">${ordersTable(list, true)}</div>`;
  },
  tools: (k) => `
    <div class="card"><h2>اختبار الضغط</h2>
      <p class="small muted" style="margin:0 0 12px">ينشئ طلبات مدفوعة وجاهزة للطباعة (صفحة اختبار وحدة لكل طلب). <b>شغّل «وضع التجربة» في البرنامج قبلها</b> عشان ما يطبع فعليًا ويستهلك ورق.</p>
      <div class="toolbar"><input class="f mono" id="nTest" type="number" min="1" max="50" value="10" style="width:90px" aria-label="عدد الطلبات"><button class="btn primary" id="mkTest">أنشئ طلبات تجريبية</button></div>
      <div class="small muted" style="margin-top:10px">طلبات التجربة على هذي الطابعة: ${S.orders.filter((o) => o.kiosk_id === k.kiosk_id && o.source === "test").length} · بانتظار الطباعة: ${S.orders.filter((o) => o.kiosk_id === k.kiosk_id && o.source === "test" && ["queued", "printing"].includes(o.print_status)).length}</div>
    </div>
    <div class="card" style="border-color:var(--danger-line)"><h2 style="color:var(--bad)">منطقة الخطر</h2>
      <p class="small muted" style="margin:0 0 12px">الحذف: لو الطابعة عليها طلبات سابقة تنؤرشف (تختفي وتبقى السجلات والتقارير، وتقدر ترجعها)، وإلا تنحذف نهائيًا. وفي الحالتين ينفك ربط الجهاز.</p>
      <button class="btn danger" id="delK">حذف الطابعة</button>
    </div>`,
};

function cmdList(kid) {
  const list = S.commands.filter((c) => c.kiosk_id === kid).slice(0, 6);
  if (!list.length) return "";
  const N = { test_print: "صفحة اختبار", refresh_status: "تحديث الحساسات", pause: "إيقاف مؤقت", resume: "تشغيل" };
  return `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>الأمر</th><th>الحالة</th><th>النتيجة</th><th>الوقت</th></tr></thead><tbody>
    ${list.map((c) => `<tr><td>${N[c.command] || c.command}</td><td>${pill(c.status === "done" ? ["ok", "تم"] : c.status === "failed" ? ["bad", "فشل"] : ["warn", "بانتظار الجهاز"])}</td><td class="small">${esc(c.result || "—")}</td><td class="small muted">${fmtTime(c.created_at)}</td></tr>`).join("")}</tbody></table></div>`;
}

function kioskForm(k) {
  const v = (f, d = "") => esc(k?.[f] ?? d);
  return `<form class="card form" id="kForm" novalidate>
    <h3 style="border:0;padding:0;margin:0">الأساسيات</h3>
    <label>رقم الطابعة <small>${k ? "ما يتغيّر بعد الإنشاء" : "يظهر على الملصق وفي الرابط. حروف إنجليزية وأرقام فقط، مثل 101"}</small><input class="f mono ltr" name="kiosk_id" required maxlength="20" pattern="[A-Za-z0-9_\\-]{1,20}" value="${v("kiosk_id")}" ${k ? "readonly" : ""}></label>
    <label>المكان <small>يشوفه العميل</small><input class="f" name="location_name" required maxlength="80" value="${v("location_name")}" placeholder="مكتبة الجامعة — الدور الأرضي"></label>
    <label class="full">ملاحظة للعميل <small>اختياري، مثل «جنب المصلى»</small><input class="f" name="public_note" maxlength="80" value="${v("public_note")}"></label>
    <label>الموديل<input class="f ltr" name="model" maxlength="60" value="${v("model")}" placeholder="Brother HL-L6410DN"></label>
    <label>عنوان IP للطابعة <small>للحساسات (يُكتب أيضًا في البرنامج)</small><input class="f mono ltr" name="printer_host" maxlength="60" value="${v("printer_host")}" placeholder="192.168.1.50"></label>
    <h3>الموقع (يظهر في صفحة «وين الطابعات» على الموقع)</h3>
    <label>المدينة<input class="f" name="city" list="cities" maxlength="40" value="${v("city")}" placeholder="الرياض"></label>
    <label>الحي / الجهة<input class="f" name="area" maxlength="60" value="${v("area")}" placeholder="جامعة الملك سعود"></label>
    <label class="full">رابط قوقل ماب <small>الصقه وتنعبّى الإحداثيات تلقائيًا (افتح المكان في قوقل ماب ← مشاركة ← نسخ الرابط الطويل)</small><input class="f ltr" id="mapLink" placeholder="https://www.google.com/maps/@24.72,46.62,17z"></label>
    <label>خط العرض (lat)<input class="f mono ltr" name="lat" inputmode="decimal" value="${v("lat")}" placeholder="24.7136"></label>
    <label>خط الطول (lng)<input class="f mono ltr" name="lng" inputmode="decimal" value="${v("lng")}" placeholder="46.6753"></label>
    <div class="full loc-state" id="locState"></div>
    <label>ساعات التشغيل <small>اختياري</small><input class="f" name="hours" maxlength="60" value="${v("hours")}" placeholder="24 ساعة"></label>
    <label class="check"><input type="checkbox" name="is_public" ${k ? (k.is_public !== false ? "checked" : "") : "checked"}> تظهر للعامة في الموقع</label>
    <datalist id="cities">${["الرياض", "جدة", "مكة المكرمة", "المدينة المنورة", "الدمام", "الخبر", "الظهران", "الأحساء", "القصيم", "أبها", "تبوك", "حائل", "الطائف", "جازان", "نجران", "الجبيل", "ينبع"].map((c) => `<option value="${c}">`).join("")}</datalist>
    <h3>التسعير والحدود</h3>
    <label>سعر الصفحة (ر.س)<input class="f mono" name="price_per_page" type="number" step="0.05" min="0" max="10" required value="${v("price_per_page", "0.20")}"></label>
    <label>أقل مبلغ للطلب (ر.س) <small>0 = بدون حد</small><input class="f mono" name="min_order_amount" type="number" step="0.5" min="0" max="100" value="${v("min_order_amount", "0")}"></label>
    <label>أقصى صفحات للطلب<input class="f mono" name="max_pages_per_order" type="number" min="1" max="500" value="${v("max_pages_per_order", "100")}"></label>
    <label>أقصى عدد نسخ<input class="f mono" name="max_copies" type="number" min="1" max="50" value="${v("max_copies", "20")}"></label>
    <label class="check"><input type="checkbox" name="supports_duplex" ${k ? (k.supports_duplex ? "checked" : "") : "checked"}> تطبع على الوجهين</label>
    <label>مقاس الورق<select class="f" name="paper_size">${["A4", "Letter"].map((s) => `<option ${(k?.paper_size || "A4") === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
    <h3>الورق والحبر</h3>
    <label>سعة درج الورق<input class="f mono" name="paper_capacity" type="number" min="1" max="2000" value="${v("paper_capacity", "250")}"></label>
    <label>هامش الأمان <small>آخر كم ورقة ما تنباع</small><input class="f mono" name="paper_safety_margin" type="number" min="0" max="200" value="${v("paper_safety_margin", "10")}"></label>
    <label>تنبيه «الورق قليل» عند<input class="f mono" name="low_paper_alert" type="number" min="0" max="2000" value="${v("low_paper_alert", "30")}"></label>
    <label>أقل نسبة حبر نقبل عندها طلبات (%)<input class="f mono" name="ink_min_percent" type="number" min="0" max="100" value="${v("ink_min_percent", "15")}"></label>
    <label>عمر الخرطوشة (صفحات) <small>للتقدير إذا الطابعة ما تعطي نسبة</small><input class="f mono" name="toner_yield_pages" type="number" min="0" max="100000" value="${v("toner_yield_pages")}"></label>
    <label class="full">ملاحظات داخلية <small>للمدراء فقط</small><textarea class="f" name="internal_note" maxlength="500">${v("internal_note")}</textarea></label>
    <div class="full toolbar savebar"><button class="btn primary" style="min-height:42px">${k ? "حفظ التعديلات" : "إضافة الطابعة"}</button>${k ? "" : `<span class="small muted">بعد الإضافة: «الجهاز والربط» ثم «الباركود والملصق».</span>`}</div>
    <div id="kErr" class="full alert bad" hidden></div>
  </form>`;
}

function kioskDrawerAfter(d) {
  const k = S.kiosks.find((x) => x.kiosk_id === d.id);
  $$("[data-sub]").forEach((b) => b.onclick = () => { d.sub = b.dataset.sub; renderDrawer(); });
  const form = $("#kForm");
  const ml = $("#mapLink");
  const locState = () => {
    const box = $("#locState"); if (!box || !form) return;
    const la = form.lat.value.trim(), ln = form.lng.value.trim();
    const savedLa = k?.lat != null ? String(k.lat) : "", savedLn = k?.lng != null ? String(k.lng) : "";
    const valid = la !== "" && ln !== "" && Number.isFinite(+la) && Number.isFinite(+ln) && Math.abs(+la) <= 90 && Math.abs(+ln) <= 180;
    const inKsa = valid && +la > 15 && +la < 33 && +ln > 34 && +ln < 57;
    const dirty = la !== savedLa || ln !== savedLn;
    const city = form.city.value.trim();
    let cls = "bad", msg;
    if (!valid && (la || ln)) msg = "⚠️ الإحداثيات ناقصة أو مو أرقام.";
    else if (!valid) { cls = savedLa ? "bad" : "warn"; msg = city ? `📍 الموقع الدقيق <b>غير محدد</b> — الطابعة بتطلع في الخريطة داخل «${esc(city)}» بدون موقع دقيق.` : "📍 الموقع <b>غير محدد</b> والمدينة فاضية — الطابعة ما بتطلع في الخريطة. اكتب المدينة على الأقل."; }
    else {
      cls = dirty ? "warn" : "ok";
      msg = (dirty ? "🟡 إحداثيات جديدة <b>ما انحفظت بعد</b> — اضغط «حفظ التعديلات»." : "✅ الموقع <b>محفوظ</b>.") + (inKsa ? "" : " ⚠️ النقطة برّا السعودية، تأكد إن lat و lng مو معكوسين.") +
        ` <a href="https://www.google.com/maps/search/?api=1&query=${+la},${+ln}" target="_blank" rel="noopener">تأكد منه على قوقل ماب ↗</a>`;
    }
    box.className = "full loc-state " + cls; box.innerHTML = msg;
  };
  if (form) { form.lat.oninput = form.lng.oninput = form.city.oninput = locState; locState(); }
  if (ml) ml.oninput = () => {
    const v = ml.value.trim();
    const m = v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || v.match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i) || v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || v.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
    if (m) { form.lat.value = (+m[1]).toFixed(6); form.lng.value = (+m[2]).toFixed(6); toast("تعبّت الإحداثيات من الرابط — لا تنسى تحفظ"); }
    else if (/goo\.gl|maps\.app/i.test(v)) toast("هذا رابط مختصر وما فيه إحداثيات. افتحه في المتصفح وانسخ الرابط الطويل من الشريط، أو اضغط مطوّلًا على المكان في قوقل ماب وانسخ الرقمين (مثل 24.71, 46.67) والصقهم هنا.");
    else if (v) toast("ما لقيت إحداثيات في الرابط.");
    locState();
  };
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const fd = new FormData(form), p = {};
    for (const [key, val] of fd.entries()) p[key] = String(val).trim();
    p.supports_duplex = !!form.supports_duplex.checked;
    p.is_public = !!form.is_public.checked;
    for (const n of ["lat", "lng"]) { if (p[n] !== "" && !Number.isFinite(Number(p[n]))) { const b = $("#kErr"); b.textContent = "الإحداثيات لازم تكون أرقام."; b.hidden = false; return; } }
    for (const n of ["price_per_page", "min_order_amount"]) p[n] = Number(p[n] || 0);
    for (const n of ["max_pages_per_order", "max_copies", "paper_capacity", "paper_safety_margin", "low_paper_alert", "ink_min_percent"]) p[n] = parseInt(p[n] || "0", 10);
    if (p.toner_yield_pages === "") p.toner_yield_pages = ""; else p.toner_yield_pages = parseInt(p.toner_yield_pages, 10);
    try {
      const r = await S.db.rpc("admin_save_kiosk", { p });
      toast(r.created ? "انضافت الطابعة" : "تم الحفظ");
      document.activeElement?.blur();
      S.drawer = { type: "kiosk", id: p.kiosk_id, sub: r.created ? "device" : "settings" };
      await reload();
    } catch (er) { const b = $("#kErr"); b.textContent = errMsg(er); b.hidden = false; }
  };
  if (!k) return;
  const kid = k.kiosk_id;
  $$("[data-cmd]").forEach((b) => b.onclick = () => act(() => S.db.sendCommand(kid, b.dataset.cmd), "انرسل الأمر للجهاز"));
  $("#disableK") && ($("#disableK").onclick = async () => { if (await ask({ title: "إيقاف استقبال الطلبات؟", body: "<p>العملاء بيشوفون الطابعة «خارج الخدمة» لين تفعّلها.</p>", ok: "إيقاف", danger: true })) act(() => S.db.rpc("admin_set_kiosk_enabled", { p_kiosk: kid, p_enabled: false }), "توقف استقبال الطلبات"); });
  $("#enableK") && ($("#enableK").onclick = () => act(() => S.db.rpc("admin_set_kiosk_enabled", { p_kiosk: kid, p_enabled: true }), "رجعت تستقبل طلبات"));
  if ($("#refill")) {
    $("#refill").onclick = async () => {
      const n = await ask({ title: "كم ورقة حطيت؟", ok: "إضافة", body: `<form class="form" style="grid-template-columns:1fr"><label>عدد الأوراق المضافة<input class="f mono" id="nIn" type="number" min="1" max="${k.paper_capacity}" required value="${Math.max(1, k.paper_capacity - (k.current_paper_count || 0))}"></label></form><p class="small" style="margin-top:8px">الحالي ${k.current_paper_count} من ${k.paper_capacity}.</p>`, form: () => parseInt($("#nIn").value, 10) });
      if (n) act(() => S.db.rpc("admin_paper_refill", { p_kiosk: kid, p_added: n }), "انضاف الورق");
    };
    $("#setPaper").onclick = async () => {
      const n = await ask({ title: "جرد الورق", ok: "حفظ", body: `<p>عدّيت الورق اللي في الدرج؟ اكتب العدد الفعلي.</p><form class="form" style="grid-template-columns:1fr"><label>العدد الفعلي<input class="f mono" id="nIn" type="number" min="0" max="${k.paper_capacity}" required value="${k.current_paper_count}"></label></form>`, form: () => parseInt($("#nIn").value, 10) });
      if (n !== null && !Number.isNaN(n)) act(() => S.db.rpc("admin_set_paper", { p_kiosk: kid, p_count: n }), "تم الحفظ");
    };
    $("#toner").onclick = async () => { if (await ask({ title: "غيّرت خرطوشة الحبر؟", body: "<p>بنرجّع النسبة 100% ونصفّر عداد الصفحات.</p>", ok: "إيه، غيّرتها" })) act(() => S.db.rpc("admin_toner_replaced", { p_kiosk: kid }), "تم"); };
    $("#setInk").onclick = async () => {
      const n = await ask({ title: "نسبة الحبر", ok: "حفظ", body: `<form class="form" style="grid-template-columns:1fr"><label>النسبة (%)<input class="f mono" id="nIn" type="number" min="0" max="100" required value="${k.ink_level_percent ?? 100}"></label></form>`, form: () => parseInt($("#nIn").value, 10) });
      if (n !== null && !Number.isNaN(n)) act(() => S.db.rpc("admin_set_ink", { p_kiosk: kid, p_percent: n }), "تم الحفظ");
    };
    S.db.events(kid).then((ev) => {
      const N = { paper_refill: "تعبئة ورق", paper_set: "جرد ورق", paper_used: "استهلاك", toner_replaced: "تغيير حبر", ink_reading: "قراءة حبر", settings: "تعديل إعدادات" };
      const el = $("#evts"); if (!el) return;
      el.innerHTML = ev.length ? `<div class="table-wrap"><table><thead><tr><th>الحدث</th><th>الكمية</th><th>ملاحظة</th><th>الوقت</th></tr></thead><tbody>${ev.map((e) => `<tr><td>${N[e.kind] || e.kind}</td><td class="mono">${e.amount ?? "—"}</td><td class="small">${e.kind === "paper_used" ? `<a href="#" data-order="${esc(e.note)}">#${ref(e.note)}</a>` : esc(e.note || "")}</td><td class="small muted">${fmtTime(e.created_at)}</td></tr>`).join("")}</tbody></table></div>` : "ما فيه حركات.";
      labelTables(el); bindOrderLinks(el);
    }).catch(() => { const el = $("#evts"); if (el) el.textContent = "تعذر التحميل."; });
  }
  if ($("#pairBtn")) {
    $("#pairBtn").onclick = async () => {
      try {
        const code = await S.db.rpc("admin_create_pairing_code", { p_kiosk: kid });
        $("#pairOut").innerHTML = `<div class="pairbox" aria-label="كود الربط">${esc(code)}</div><p class="small muted" style="text-align:center;margin:8px 0 12px">صالح 15 دقيقة. ما راح يظهر مرة ثانية.</p>`;
      } catch (e) { toast(errMsg(e), true); }
    };
    $("#unpair") && ($("#unpair").onclick = async () => { if (await ask({ title: "فك ربط الجهاز؟", body: "<p>الجهاز بيوقف فورًا وما يقدر يسحب طلبات لين تربطه من جديد.</p>", ok: "فك الربط", danger: true })) act(() => S.db.rpc("admin_unpair_kiosk", { p_kiosk: kid }), "انفك الربط"); });
  }
  if ($("#copyLink")) {
    $("#copyLink").onclick = async () => { try { await navigator.clipboard.writeText(customerLink(kid)); toast("انسخ الرابط"); } catch { toast("ما قدرنا ننسخ", true); } };
    $("#sticker").onclick = () => openSticker(k);
    $("#stickerTest").onclick = () => toast("هذي الميزة تجي مع تحديث برنامج الطباعة القادم.");
  }
  if ($("#mkTest")) {
    $("#mkTest").onclick = async () => {
      const n = parseInt($("#nTest").value, 10);
      if (!k.agent_dry_run && !(await ask({ title: "البرنامج مو في وضع التجربة", body: `<p>الطابعة بتطبع ${n} ورقة فعليًا. متأكد؟</p>`, ok: "إيه، اطبع", danger: true }))) return;
      act(() => S.db.rpc("admin_create_test_orders", { p_kiosk: kid, p_count: n, p_pages: 1 }), `انضاف ${n} طلب تجريبي`);
    };
    $("#delK").onclick = async () => {
      const typed = await ask({ title: `حذف الطابعة ${kid}؟`, ok: "حذف", danger: true,
        body: `<p>للتأكيد اكتب رقم الطابعة.</p><form class="form" style="grid-template-columns:1fr"><label>رقم الطابعة<input class="f mono ltr" id="cIn" required autocomplete="off"></label></form>`, form: () => $("#cIn").value.trim() });
      if (typed === null) return;
      if (typed !== kid) return toast("الرقم غير مطابق، ما انحذف شي.", true);
      try { const r = await S.db.rpc("admin_delete_kiosk", { p_kiosk: kid }); toast(r === "archived" ? "انؤرشفت الطابعة (عليها طلبات سابقة)" : "انحذفت الطابعة"); closeDrawer(); await reload(); }
      catch (e) { toast(errMsg(e), true); }
    };
  }
  bindOrderLinks($(".drawer"));
}

function openSticker(k) {
  const w = window.open("", "_blank"); if (!w) return toast("المتصفح منع النافذة. اسمح بالنوافذ المنبثقة.", true);
  const wa = String(S.settings.support_whatsapp || "");
  w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ملصق ${esc(k.kiosk_id)}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>@page{size:A6;margin:0}body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif;color:#14181B}
  .s{width:105mm;height:148mm;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}

/* ================= درج الطلب ================= */
function orderDrawer(d) {
  const o = S.orders.find((x) => x.id === d.id);
  if (!o) return `<div class="dh"><h2>الطلب</h2><button class="btn sm" id="dClose">إغلاق</button></div><div class="db"><div class="empty">الطلب خارج الفترة المحمّلة.</div></div>`;
  const steps = [
    ["أنشئ", o.created_at], ["تم التسعير وحجز الورق", o.quoted_at], ["دفع", o.paid_at],
    [o.source === "web" ? "ضغط «اطبع الآن»" : "دخل الطابور", o.released_at || (o.source !== "web" ? o.paid_at : null)],
    ["انطبع", o.printed_at], ...(o.cancelled_at ? [["أُلغي / انتهى", o.cancelled_at]] : [])];
  const canCancel = !["printed", "printing", "cancelled"].includes(o.print_status) && !["expired", "cancelled"].includes(o.payment_status);
  const canRetry = o.payment_status === "paid" && ["failed", "retryable_failed"].includes(o.print_status);
  return `<div class="dh"><span class="code">#${ref(o.id)}</span><h2>${esc(o.original_name || "طلب")}</h2>${pill(orderStatus(o))}<button class="btn sm" id="dClose">إغلاق</button></div>
  <div class="db">
    <div class="card"><dl class="kv">
      <dt>الطابعة</dt><dd><a href="#" data-kiosk="${esc(o.kiosk_id)}" class="mono">${esc(o.kiosk_id)}</a></dd>
      <dt>المصدر</dt><dd>${SOURCE[o.source] || o.source}</dd>
      <dt>الملف</dt><dd>${o.file_kind === "image" ? "صورة" : "PDF"} · ${o.total_pages} صفحة ${o.file_deleted_at ? pill(["mute", "انحذف"]) : ""}</dd>
      <dt>الخيارات</dt><dd>${o.copies} نسخة · ${o.duplex ? "وجهين" : "وجه واحد"} · ${o.sheets_needed ?? "—"} ورقة</dd>
      <dt>المبلغ</dt><dd class="mono">${money(o.total_amount)} ر.س ${o.price_per_page ? `<span class="small muted">(${money(o.price_per_page)}/ص)</span>` : ""}</dd>
      <dt>محاولات الطباعة</dt><dd class="mono">${o.print_attempts || 0}</dd>
      ${o.error_message ? `<dt>ملاحظة</dt><dd>${esc(o.error_message)}</dd>` : ""}
      ${o.refund_note ? `<dt>ملاحظة الاسترجاع</dt><dd>${esc(o.refund_note)}</dd>` : ""}
      <dt>المعرّف</dt><dd class="mono small ltr">${o.id}</dd>
    </dl></div>
    <div class="card"><h2>المسار</h2><div class="timeline">${steps.map(([l, t]) => `<div class="${t ? "" : "off"}"><b>${l}</b> <span class="small muted">${t ? fmtTime(t) : "—"}</span></div>`).join("")}</div></div>
    <div class="card"><h2>إجراءات</h2><div class="toolbar">
      ${canRetry ? `<button class="btn primary" id="oRetry">أعد المحاولة</button>` : ""}
      ${o.refund_status === "needs_refund" ? `<button class="btn primary" id="oRefund">تم الاسترجاع</button>` : ""}
      ${canCancel ? `<button class="btn danger" id="oCancel">إلغاء الطلب</button>` : ""}
      ${!canRetry && !canCancel && o.refund_status !== "needs_refund" ? `<span class="small muted">ما فيه إجراءات متاحة لهذي الحالة.</span>` : ""}
    </div></div>
  </div>`;
}
function orderDrawerAfter(d) {
  $("#oRetry") && ($("#oRetry").onclick = () => act(() => S.db.rpc("admin_retry_order", { p_order: d.id }), "رجع للطابور"));
  $("#oRefund") && ($("#oRefund").onclick = () => refundOrder(d.id));
  $("#oCancel") && ($("#oCancel").onclick = async () => {
    const o = S.orders.find((x) => x.id === d.id);
    if (await ask({ title: "إلغاء الطلب؟", body: `<p>${o.payment_status === "paid" && o.source !== "test" ? "الطلب مدفوع، فبيدخل قائمة «يحتاج استرجاع»." : "بيرجع الورق المحجوز."}</p>`, ok: "إلغاء الطلب", danger: true }))
      act(() => S.db.rpc("admin_cancel_order", { p_order: d.id }), "انلغى الطلب");
  });
  $$("[data-kiosk]", $(".drawer")).forEach((a) => a.onclick = (e) => { e.preventDefault(); openKiosk(a.dataset.kiosk); });
}
function bindOrderLinks(root) { $$("[data-order]", root).forEach((el) => el.onclick = (e) => { e.preventDefault(); openOrder(el.dataset.order); }); }

/* الوضع الليلي/النهاري */
function syncThemeButtons() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  $$("[data-theme-toggle]").forEach((b) => { if (!b.classList.contains("icon-btn")) b.textContent = dark ? "الوضع النهاري" : "الوضع الليلي"; });
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("[data-theme-toggle]")) return;
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("tabaety.theme", next); } catch { }
  syncThemeButtons();
});
syncThemeButtons();

/* أحداث عامة */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-kiosk],[data-order],[data-go],[data-new-kiosk]");
  if (!t || t.closest(".drawer")) return;
  e.preventDefault();
  if (t.dataset.kiosk) openKiosk(t.dataset.kiosk);
  else if (t.dataset.order) openOrder(t.dataset.order);
  else if (t.dataset.go) { S.tab = t.dataset.go; render(); }
  else if (t.hasAttribute("data-new-kiosk")) openNewKiosk();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.drawer && !$("#dlg").open) closeDrawer();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".pcard")) { e.preventDefault(); openKiosk(e.target.dataset.kiosk); }
});

/* ================= البداية ================= */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

async function startApp() {
  $("#login").hidden = true; $("#shell").hidden = false;
  try { S.tab = localStorage.getItem("tabaety.tab") || "overview"; } catch { }
  if (!PAGES[S.tab]) S.tab = "overview";
  $("#who").textContent = S.user?.email || "";
  await reload();
  setInterval(() => { if (!document.hidden) render(); }, 30000); // «قبل كم دقيقة» والحالات تتحدث
}

(async function boot() {
  loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js").catch(() => {});
  // اختبارات محلية فقط: تُحقن من أداة الاختبار، وما لها أي رابط أو زر في الصفحة
  if (typeof window.__TABAETY_TEST_DB__ === "function") {
    S.demo = true; $("#demoBanner").hidden = false; S.db = window.__TABAETY_TEST_DB__(); S.user = { email: "test@local" };
    $("#liveDot").classList.add("off"); $("#liveDot span").textContent = "وضع العرض";
    $("#logoutBtn").onclick = () => location.href = location.pathname;
    return startApp();
  }
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
  const sb = window.supabase.createClient(CONFIG.url, CONFIG.anonKey);
  S.db = realDb(sb);
  $("#logoutBtn").onclick = $("#logoutBtnM").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const enter = async (session) => {
    S.user = session.user;
    const ok = await sb.rpc("is_admin");
    if (!ok.data) { await sb.auth.signOut(); $("#login").hidden = false; const b = $("#loginErr"); b.textContent = "هذا الحساب ما عنده صلاحية مدير."; b.hidden = false; return; }
    sb.channel("dash")
      .on("postgres_changes", { event: "*", schema: "public", table: "kiosks" }, softReload)
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, softReload)
      .on("postgres_changes", { event: "*", schema: "public", table: "kiosk_commands" }, softReload)
      .on("postgres_changes", { event: "*", schema: "public", table: "payments" }, softReload)
      .subscribe((st) => { const ok = st === "SUBSCRIBED"; $("#liveDot").classList.toggle("off", !ok); $("#liveDotM").classList.toggle("off", !ok); $("#liveDot span").textContent = ok ? "تحديث لحظي" : "غير متصل"; });
    await startApp();
  };
  const { data: { session } } = await sb.auth.getSession();
  if (session) return enter(session);
  $("#login").hidden = false;
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault(); const b = $("#loginBtn"); b.disabled = true; $("#loginErr").hidden = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pass").value });
    b.disabled = false;
    if (error) { const x = $("#loginErr"); x.textContent = /invalid/i.test(error.message) ? "الإيميل أو كلمة المرور غلط." : error.message; x.hidden = false; return; }
    enter(data.session);
  };
})();

</script>
